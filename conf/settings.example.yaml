# ==============================================================================
# 智能客服系统配置文件
# ==============================================================================
# 使用说明：
#   1. 复制本文件为 settings.yaml: cp settings.example.yaml settings.yaml
#   2. 根据实际环境修改下方配置
#   3. settings.yaml 已被 .gitignore 忽略，不会提交到版本库
# ==============================================================================

# ------------------------------------------------------------------------------
# LLM 大语言模型配置
# ------------------------------------------------------------------------------
# 通过 OpenAI 兼容协议接入，支持：OpenAI、文心一言、通义千问、智谱 GLM、DeepSeek 等
# 只需修改 base_url 和 api_key 即可切换不同厂商的模型
llm:
  base_url: "https://api.openai.com/v1"    # API 地址（各厂商 OpenAI 兼容端点）
  api_key: "sk-your-api-key-here"          # API 密钥
  model_name: "gpt-4"                       # 模型名称
  temperature: 0.7                          # 生成随机性 (0.0~1.0)，越低越确定
  max_tokens: 2048                          # 单次回答最大 token 数

# ------------------------------------------------------------------------------
# Embedding 向量化模型配置
# ------------------------------------------------------------------------------
# 用于将文本转换为向量，存入 Milvus 进行相似度检索
# 支持两种加载方式：
#   - 本地路径："/app/models/bge-large-zh-v1.5"（推荐，需预下载）
#   - HuggingFace 模型名："BAAI/bge-large-zh-v1.5"（需容器内联网）
embedding:
  model_name: "/app/models/bge-large-zh-v1.5"
  device: "cpu"                             # cpu 或 cuda（有 GPU 时用 cuda 加速）

# ------------------------------------------------------------------------------
# 知识库配置
# ------------------------------------------------------------------------------
# 系统会自动加载该目录下的文档并切分为小段落（chunk）
knowledge_base:
  docs_dir: "./knowledge_docs"              # 知识文档存放目录
  chunk_size: 512                           # 每个文本块的最大字符数
  chunk_overlap: 50                         # 相邻文本块的重叠字符数（保证上下文连贯）

# ------------------------------------------------------------------------------
# Milvus 向量数据库配置
# ------------------------------------------------------------------------------
# Milvus 在 Docker Compose 中作为独立容器运行
# host 使用容器服务名（Docker 内部 DNS 解析）
milvus:
  host: "milvus"                            # Docker 服务名，不要改为 localhost
  port: 19530                               # Milvus gRPC 端口
  collection_name: "customer_service_kb"    # 向量集合名称

# ------------------------------------------------------------------------------
# Cross-Encoder 精排配置
# ------------------------------------------------------------------------------
# 对 Milvus 粗排返回的 top_k 结果进行二次精排
# 使用 CrossEncoder 模型计算 query-document 的精确相似度
# 该模型在 CPU 上运行，不是 LLM，无需 GPU
reranker:
  model_name: "/app/models/bge-reranker-base"  # 本地路径或 "BAAI/bge-reranker-base"
  top_k: 5                                  # 精排后保留的文档数（送入 LLM）
  timeout_seconds: 10                       # 精排超时秒数，超时则降级使用粗排结果

# ------------------------------------------------------------------------------
# 检索配置
# ------------------------------------------------------------------------------
retrieval:
  top_k: 20                                 # Milvus 粗排返回的候选文档数

# ------------------------------------------------------------------------------
# 服务端口配置
# ------------------------------------------------------------------------------
# API 端口和 Metrics 端口分离，Metrics 仅内部暴露给 Prometheus
server:
  host: "0.0.0.0"
  port: 8000                                # FastAPI 业务接口端口（对外）
  metrics_port: 9100                        # Prometheus 指标端口（仅内部）

# ------------------------------------------------------------------------------
# 日志配置
# ------------------------------------------------------------------------------
# 使用 structlog 输出 JSON 格式结构化日志
logging:
  level: "INFO"                             # 日志级别: DEBUG, INFO, WARNING, ERROR
  file: "./logs/app.log"                    # 日志文件路径

# ------------------------------------------------------------------------------
# 文件监听配置
# ------------------------------------------------------------------------------
# 监听 knowledge_docs 目录变化，自动触发知识库重建
watcher:
  enabled: true                             # 是否启用自动监听
  debounce_seconds: 30                      # 防抖时间：多次变更在此时间内只触发一次重建
